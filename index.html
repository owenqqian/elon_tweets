<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elon Musk Live Tweets</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #f7f9f9;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid #2f3336;
            text-align: center;
            padding: 12px 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #00ba7c;
            border-radius: 50%;
            margin-right: 6px;
        }

        main {
            width: 100%;
            max-width: 650px;
            height: calc(100vh - 50px);
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1><span class="live-dot"></span>Elon Musk 推文实时流</h1>
    </header>

    <main>
        <!-- 使用稳定极简代理，绕过 X 官方未登录限制 -->
        <iframe src="https://nitter.net/elonmusk" title="Elon Musk Tweets"></iframe>
    </main>

</body>
</html>
